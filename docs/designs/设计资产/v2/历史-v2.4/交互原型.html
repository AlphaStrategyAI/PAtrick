/* PAtrick v2.3 · 80px square running mark. Keep text status alongside it. */
.patrick-live { width: var(--patrick-mark-size, 80px); height: var(--patrick-mark-size, 80px); display: block; flex: 0 0 var(--patrick-mark-size, 80px); overflow: visible; }
.patrick-live .orbit-runner { transform-origin: 48px 48px; animation: patrick-orbit 4.8s linear infinite; }
.patrick-live .curious-eye { animation: patrick-gaze 4.8s ease-in-out infinite; }
.patrick-live:not([data-state="running"]) .orbit-runner { display: none; animation: none; }
.patrick-live:not([data-state="running"]) .curious-eye { animation: none; }
.patrick-live[data-state="paused"] .orbit-track { opacity: .36; }
.patrick-live[data-state="offline"] .patrick-glyph,
.patrick-live[data-state="unknown"] .patrick-glyph { opacity: .56; }
.patrick-live[data-state="offline"] .orbit-track,
.patrick-live[data-state="unknown"] .orbit-track { opacity: .25; }
.patrick-live[data-reduced-motion="true"] .orbit-runner,
.patrick-live[data-reduced-motion="true"] .curious-eye,
.motion-reduced .patrick-live .orbit-runner,
.motion-reduced .patrick-live .curious-eye { animation: none; }
.patrick-live[data-background="true"] .orbit-runner,
.patrick-live[data-background="true"] .curious-eye { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) {
  .patrick-live .orbit-runner, .patrick-live .curious-eye { animation: none; }
}
@keyframes patrick-orbit { to { transform: rotate(360deg); } }
@keyframes patrick-gaze {
  0%, 32%, 100% { transform: translate(0,0); }
  44%, 60% { transform: translate(-5px,2px); }
  74%, 86% { transform: translate(3px,-3px); }
}

function modalBody(){if(!S.modal)return '';let title='',body='',actions='';const sm=settingsModal();if(sm){title=sm.title;body=sm.body;actions=sm.actions}if(S.modal==='expired'){title=t('changeTitle');body=`<p>${t('changeText')}</p><div class="note warn" style="margin-top:15px">${t('expiredText')}</div>`;actions=btn('cancel','modalClose')+btn('refreshQuestion','refreshQuestion','primary')}if(S.modal==='pause'||S.modal==='stop'){const stopping=S.modal==='stop';title=t(stopping?'stopTitle':'pauseTitle');body=`<p>${t(stopping?'stopText':'pauseText')}</p><div class="data-row"><label>${t('delegation')}</label><span>${t(S.activeScope==='research'?'researchName':'delegationName')}</span></div><div class="note" style="margin-top:15px">${t('trustedControlNote')}</div>`;actions=btn('cancel','modalClose')+btn('trustedHandoff',stopping?'confirmStop':'confirmPause','primary')}if(S.modal==='trusted'){title=t('trustedTitle');body=`<p>${t('trustedBody')}</p><div class="data-row"><label>${t('delegation')}</label><span>${t((S.controlAction==='enable'?S.setupScope:S.activeScope)==='research'?'researchName':'delegationName')}</span></div><div class="note warn" style="margin-top:16px">${t('trustedPreview')}</div>`;actions=btn('cancel','modalClose')+btn('loadTrustedReceipt','trustedReceipt','primary')}if(S.modal==='rollback'){title=t('rollbackTitle');body=`<p>${t('rollbackText')}</p><div class="field"><label for="rollbackReason">${t('rollbackReason')}</label><textarea id="rollbackReason" data-field="rollbackReason" placeholder="${t('rollbackPlaceholder')}">${esc(S.rollbackReason)}</textarea></div>`;actions=btn('cancel','modalClose')+btn('rollbackConfirm','confirmRollback','primary',`id="rollbackConfirm" ${!S.rollbackReason.trim()?'disabled':''}`)}if(S.modal==='source'){title=t('sourceDrawerTitle');body=`<div class="quote">${t('sourceQuote')}</div><button class="link" style="margin-top:8px" data-action="sourceTranslation">${t(S.sourceTranslation?'hideTranslation':'translation')}</button>${S.sourceTranslation?`<p style="margin-top:8px">${t('sourceQuoteTranslation')}</p>`:''}<p class="tiny" style="margin-top:16px">${t('sourceOrigin')}</p><div class="divider"></div><div class="context-trace subtext">${t('sourceTrace')}</div><p style="margin-top:16px">${t('evidenceLoading')}</p>`;actions=btn('done','modalClose','primary')}if(S.modal==='result'){title=t('sampleReceiptTitle');body=`<p>${t('sampleReceiptText').replaceAll('r18',S.answer?.revision||'r18')}</p><div class="note" style="margin-top:16px">${t('notConnected')}</div>`;actions=btn('done','modalClose','primary')}return `<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row spread" style="align-items:flex-start"><h2 id="modalTitle">${title}</h2><div class="row"><div class="language" role="group" aria-label="${t('uiLanguage')}"><button data-action="lang:en" class="${S.lang==='en'?'active':''}" aria-pressed="${S.lang==='en'}">EN</button><button data-action="lang:zh" class="${S.lang==='zh'?'active':''}" aria-pressed="${S.lang==='zh'}">中文</button></div><button class="icon-btn" data-action="modalClose" aria-label="${t('close')}">${icon('close')}</button></div></div>${body}<div class="modal-actions">${actions}</div></section></div>`}
let toastTimer,decisionTimer,candidateTimer;
function render(opts={}){const old=document.getElementById('mainScroll');const oldScroll=old?.scrollTop||0;if(old&&!opts.newView)S.scroll[S.view]=oldScroll;const active=document.activeElement;const focusId=active?.id;const focusAction=active?.dataset.action;const focusTag=active?.tagName;const focusInModal=!!active?.closest('.modal');const sel=active&&'selectionStart'in active?[active.selectionStart,active.selectionEnd]:null;document.title=t('title');document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';const views={work:workPage,ongoing:ongoingPage,task:taskPage,standards:standardsPage,candidate:candidatePage,knowledge:knowledgePage,delegation:delegationPage,system:systemPage,setup:setupPage,settings:settingsPage,result:resultPage,consult:consultPage};document.getElementById('app').innerHTML=sidebar()+`<main class="main">${header()}${!S.online?`<div class="offline-banner" role="status"><span>${t('offlineTitle')}<small class="offline-last-connection">${t('offlineLastConnection')}</small></span><button data-action="reconnect">${t('reconnect')}</button></div>`:''}<div class="scroll" id="mainScroll">${views[S.view]()}</div>${['work','consult'].includes(S.view)?composer():''}</main>`;document.getElementById('overlays').innerHTML=modalBody()+(S.toast?`<div class="toast" role="status">${icon('check')}<span>${t(S.toast)}</span></div>`:'');document.querySelectorAll('details[data-detail]').forEach(d=>d.addEventListener('toggle',()=>{S.details[d.dataset.detail]=d.open}));const scroll=document.getElementById('mainScroll');if(!opts.newView&&!opts.scrollToBottom&&scroll.firstElementChild&&scroll.scrollHeight-scroll.clientHeight<oldScroll)scroll.firstElementChild.style.minHeight=(oldScroll+scroll.clientHeight)+'px';scroll.scrollTop=opts.scrollToBottom?scroll.scrollHeight:opts.newView?(S.scroll[S.view]||0):oldScroll;{const root=focusInModal?document.querySelector('.modal'):document;const n=(focusId?document.getElementById(focusId):null)||(focusAction?[...(root?.querySelectorAll('[data-action]')||[])].find(n=>n.dataset.action===focusAction&&n.tagName===focusTag):null);if(n&&!n.disabled){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(...sel)}catch{}}}if(opts.focusModal){const m=document.querySelector('.modal');m?.querySelector('button,input,textarea')?.focus({preventScroll:true})}}
function changeView(v){if(['work','consult'].includes(S.view))S.chatByView[S.view]={draft:S.chatDraft,messages:S.messages};if(['work','consult'].includes(v)){S.chatDraft=S.chatByView[v].draft;S.messages=S.chatByView[v].messages}const old=document.getElementById('mainScroll');if(old)S.scroll[S.view]=old.scrollTop;S.view=v;S.menu=false;S.mobile=false;S.modal=null;render({newView:true})}
function toast(key){S.toast=key;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{S.toast=null;render()},3500)}
function openModal(kind){const a=document.activeElement;S.focusReturn={id:a?.id,action:a?.dataset.action,tag:a?.tagName};S.modal=kind;render({focusModal:true})}
function closeModal(){S.modal=null;render();const f=S.focusReturn;const n=(f?.id?document.getElementById(f.id):null)||(f?.action?[...document.querySelectorAll('[data-action]')].find(n=>n.dataset.action===f.action&&n.tagName===f.tag):null);n?.focus({preventScroll:true})}
function submitDecision(){if(!S.online||!S.selection||['expired','resumed','clarify','verifying'].includes(S.decision))return;if(S.selection==='custom'&&!S.custom.trim()){S.customError=true;render();document.getElementById('customDecision')?.focus({preventScroll:true});return}if(S.submittedKeys.has(S.idempotency)){S.decision=S.answer?.selection==='custom'?'clarify':'resumed';render();return}S.decision='verifying';S.answer={selection:S.selection,custom:S.custom,question:S.currentQuestion,revision:S.currentRevision};render();clearTimeout(decisionTimer);decisionTimer=setTimeout(()=>{if(S.decision!=='verifying')return;S.submittedKeys.add(S.idempotency);S.receiptCount++;S.decision=S.answer.selection==='custom'?'clarify':'resumed';render()},800)}

function settingsPhase(){const q=S.settings,phases=[['draft','Draft','草稿'],['validated','Validated','已验证'],['submitted','Submitted','已提交'],['effective','Effective','已生效'],['verified','Verified','已复检']];return `<div class="settings-phase" aria-label="${sx('Configuration state','配置状态')}">${phases.map(([k,en,zh])=>`<span class="${q.phase===k?'current':''}">${sx(en,zh)}</span>`).join('<i>→</i>')}</div>`}
function settingsGroupPage(){const q=S.settings,g=q.group,receiptHere=q.receipt&&q.receipt.group===g,dirty=settingsGroupDirty(),validated=q.validated===settingsBinding()&&q.validatedGroup===g;let action=dirty?(validated?(g==='preferences'?['settings:save',sx('Save preferences','保存偏好')]:['settings:review',sx('Review change','核对变更')]):['settings:validate',sx('Validate this draft','验证当前草稿')]):q.phase==='effective'&&receiptHere?['settings:check',sx('Verify this change','复查变更')]:g==='execution'&&!q.grokSignedIn&&q.checks.phase==='issues'?['settings:fix',sx('Review sign-in fix','查看登录修复')]:['settings:check',sx('Check this group','检查本组')];const fields=settingFields(g).filter(f=>g!=='operation'||!q.effective.backupDestination||S.details['settings-backup-edit']);return `<div class="page settings-page"><div class="page-head"><div><button class="link" data-action="settings:home">← ${t('settings')}</button><h1>${settingsName(g)}</h1><p class="subtext">${settingsGroupHint(g)}</p></div><button class="btn primary" data-action="${action[0]}" ${q.checks.phase==='checking'||q.phase==='submitted'?'disabled':''}>${action[1]}</button></div><div class="settings-layout"><nav class="settings-side-nav" aria-label="${t('settings')}">${SETTINGS_GROUPS.map(([id,en,zh])=>`<button data-action="settings:group:${id}" class="${id===g?'active':''}" ${id===g?'aria-current="page"':''}>${sx(en,zh)}</button>`).join('')}</nav><section class="settings-main"><div class="settings-group-meta"><span>${esc(q.effective.host)} · ${sx('Config','配置')} v${q.version} · ${sx('Sample values','样例值')}</span>${settingsBadge(settingsGroupStatus(g))}</div>${g==='execution'?settingsExecutorRows():''}${g==='execution'&&!q.grokSignedIn&&q.checks.phase==='issues'?settingsIssue():''}${g==='materials'?`<div class="settings-detected"><strong>${sx('GitHub · productIdeas / PAtrick','GitHub · productIdeas / PAtrick')}</strong><p>${sx('Approved repository detected. Correct only a changed folder or Vault.','已检测到获准仓库，仅在目录或 Vault 改变时修正。' function settingsNotice(){return({saved:sx('Local preference saved. Existing work and paused scopes are unchanged.','本地偏好已保存，现有工作与已暂停范围未变。'),reset:sx('Draft reset to the current configuration.','草稿已重置为当前配置。'),cancelled:sx('Pending checks stopped. No configuration was applied.','待执行检测已停止，未应用任何配置。'),validated:sx('This exact draft is validated. Nothing has been applied.','当前精确草稿已验证，尚未应用。'),stale:sx('The draft changed. Earlier validation and receipts cannot apply to it.','草稿已改变，原验证与回执不能应用于此版本。')})[S.settings.notice]||''}

function settingsDiagnostics(){const q=S.settings,c=q.checks;const rows=[[sx('Approved work folder and Vault','获准工作目录与 Vault'),'materials',sx('Read-only samples; source ownership and exclusions stay unchanged.','只读样本，来源归属与排除规则不变。')],['Codex CLI','execution',sx('Current isolated profile and headless entry.','当前隔离配置与无界面入口。')],['Grok Build','execution',q.grokSignedIn?sx('Same identity renewed; no paid fallback.','同一身份已续期，没有付费回退。'):sx('The isolated login needs renewal.','隔离登录需要续期。')],['DSH','execution',sx('No approved profile has been detected on this device.','本机尚未检测到获准配置。')],[sx('This device and backup','本机与备份'),'operation',sx('Registered connection and read-only backup integrity; restoration is separate.','已登记连接与只读备份完整性，恢复结果另行确认。')]];return `<details class="settings-disclosure" data-detail="settings-diagnostics" ${S.details['settings-diagnostics']?'open':''}><summary>${sx('Check evidence and diagnostics','检查依据与诊断')}</summary><div class="settings-diagnostic-table">${rows.map(([item,g,evidence],i)=>{let status=settingsGroupStatus(g);if(status==='ready'||status==='signIn')status=i===2?(q.grokSignedIn?'ready':'signIn'):i===3?'notConfigured':'ready';return `<div class="settings-result-row"><div><strong>${item}</strong><p>${evidence}</p><small>${settingsTime()} · ${esc(q.effective.host)}</small></div>${settingsBadge(status)}</div>`}).join('')}</div><p class="muted">${sx('Results belong to this device and exact draft. Detection does not grant access.','结果只属于本机与当前精确草稿；检测不会授予权限。')}</p><button class="link" data-action="settings:bundle">${sx('Preview a redacted diagnostic bundle','预览脱敏诊断包')}</button></details>`}
function settingsPage(){return S.settings.group?settingsGroupPage():settingsHome()}
function openSettingsGroup(group){const aliases={sources:'collection',knowledge:'materials',standards:'materials',executors:'execution',access:'execution',devices:'operation',backup:'operation',interaction:'preferences'};group=aliases[group]||group;if(group&&!SETTINGS_GROUPS.some(x=>x[0]===group))group=null;const q=S.settings;if(q.group!==group){q.fieldError=null;q.notice=null}q.group=group;if(q.phase!=='submitted'&&group&&settingsGroupDirty()&&q.validatedGroup!==group)q.phase='draft';changeView('settings')}

function validateSettings(){const q=S.settings,fields=settingFields(q.group);q.fieldError=fields.some(f=>!String(q.draft[f.key]).trim())?'empty':fields.some(f=>f.type==='number'&&Number(q.draft[f.key])<=0)?'number':q.group==='materials'&&[q.draft.sourcePath,q.draft.vaultPath].some(v=>!/^(\/|~\/)/.test(v))?'path':q.group==='execution'&&((q.draft.preferredExecutor==='grok'&&!q.grokSignedIn)||(q.draft.preferredExecutor==='dsh'&&!q.dshConfigured))?'route':q.group==='operation'&&(/@|password=|token=/i.test(q.draft.backupDestination))?'backup':null;if(q.fieldError){render();return}q.validated=settingsBinding();q.validatedGroup=q.group;q.phase='validated';q.notice='validated';render()}
function runSettingsChecks(){const q=S.settings;if(q.checks.phase==='checking'||q.phase==='submitted')return;const binding=settingsBinding(),run=++q.checks.run,group=q.group,groups=group?[group]:SETTINGS_GROUPS.map(x=>x[0]);q.checks.phase='checking';q.checks.group=group;q.checks.binding=binding;q.notice=null;render();clearTimeout(settingsTimer);settingsTimer=setTimeout(()=>{if(q.checks.run!==run||q.checks.binding!==binding||settingsBinding()!==binding)return;q.checks.time=Date.now();if(!S.online){q.checks.phase='offline';render();return}const beyond=groups.includes('materials')&&(q.draft.sourcePath!==q.effective.sourcePath||q.draft.vaultPath!==q.effective.vaultPath);if(beyond){q.checks.phase='permission';for(const g of groups)q.evidence[g]={status:g==='materials'?'permission':'notChecked',binding,time:q.checks.time};render();return}for(const g of groups)q.evidence[g]={status:g==='execution'&&!q.grokSignedIn?'signIn':g==='operation'&&!q.draft.backupDestination?'notConfigured':'ready',binding,time:q.checks.time};const blocked=groups.some(g=>q.evidence[g].status!=='ready');q.checks.phase=groups.includes('execution')&&!q.grokSignedIn?'issues':blocked?'failed':'rechecked';if(q.phase==='effective'&&q.receipt&&groups.includes(q.receipt.group)&&!blocked&&q.receipt.kind!=='restore')q.phase='verified';render()},680)}
function settingsChangeRows(){const q=S.settings,keys=settingFields(q.group).map(f=>f.key);return Object.keys(q.draft).filter(k=>keys.includes(k)&&q.draft[k]!==q.effective[k]).map(k=>{const f=SETTINGS_GROUPS.flatMap(x=>settingFields(x[0])).find(f=>f.key===k);return `<div class="settings-diff-row"><strong>${f?.label||k}</strong><span>${esc(settingsValue(k,q.effective[k]))}</span><span>→ ${esc(settingsValue(k,q.draft[k]))}</span></div>`}).join('')}
function startSettingsControl(kind){const q=S.settings;q.control={kind,binding:settingsBinding(),host:q.effective.host,version:q.version,revision:q.revision,group:kind==='signin'?'execution':q.group||'execution',keys:settingFields(q.group).map(f=>f.key)};openModal(kind==='signin'?'settingsFix':'settingsReview')}
function settingsModal(){const q=S.settings,m=S.modal;if(!m?.startsWith('settings'))return null;let title='',body='',actions='';const cancel=`<button class="btn" data-action="modalClose">${t('cancel')}</button>`;
if(m==='settingsFix'){title=sx('Sign in on this device','在当前设备重新登录');body=`<p>${sx('Use the isolated Grok profile. Keep the current route, limits and data domain.','使用 Grok 隔离配置，保留当前路由、预算与数据域。')}</p>${settingsDetailsRows([[sx('Device / identity','设备 / 身份'),`${esc(q.draft.host)} · grok-personal`],[sx('Impact','影响'),sx('Only queued Grok work waits. Codex continues; DSH remains unconfigured.','仅等待中的 Grok 工作受阻；Codex 可继续，DSH 仍未配置。')],[sx('After sign-in','登录之后'),sx('Read the trusted receipt, then recheck Grok and previously healthy routes.','读取可信回执，再复检 Grok 与原先正常的路由。')]])}`;actions=cancel+`<button class="btn primary" data-action="settings:handoff">${sx('Continue via trusted control','通过可信控制继续')}</button>`}
if(m==='settingsReview'){title=sx(q.control?.kind==='restore'?'Review safe restore':'Review configuration change',q.control?.kind==='restore'?'核对隔离恢复':'核对配置变更');body=q.control?.kind==='restore'?`<p>${sx('Restore into a separate workspace first. Compare newer edits, retractions, open questions and uncertain remote effects before any reopening.','先恢复到独立工作空间；重新开放前核对新修改、撤回、待答问题与远端结果不明动作。')}</p><div class="note">${sx('No overwrite or reopening is part of this preview.','此预览不包含覆盖数据或重新开放。')}</div>`:`<div class="settings-diff">${settingsChangeRows()}</div><p>${sx('Current work remains paused or running as it was. Permission, installation or device changes require a trusted receipt.','现有工作保持原运行或暂停状态；权限、安装或设备变更需要可信回执。')}</p>`;actions=cancel+`<button class="btn primary" data-action="settings:handoff">${sx('Continue via trusted control','通过可信控制继续')}</button>`}
if(m==='settingsTrusted'){title=sx('Waiting for trusted confirmation','等待可信确认');body=`<p>${sx('The request is bound to this draft and device. No change is effective until a matching receipt arrives.','请求绑定当前草稿与设备，匹配回执到达前不生效。')}</p>${settingsDetailsRows([[sx('Device / configuration','设备 / 配置'),`${esc(q.control?.host)} · v${q.control?.version}`],[sx('Draft','草稿'),`r${q.control?.revision}`]])}<div class="note warn">${sx('Local demonstration. Load a sample receipt; no login, installation, network change or restore is performed.','本地演示：仅加载示例回执，不执行登录、安装、网络变更或恢复。')}</div>`;actions=cancel+`<button class="btn primary" data-action="settings:receipt">${sx('Load sample trusted receipt','加载可信回执样例')}</button>`}
if(m==='settingsBundle'){title=sx('Diagnostic bundle preview','诊断包预览');body=`${settingsDetailsRows([[sx('Included','包含'),sx('Probe stages, status codes, versions and redacted endpoint labels.','检测阶段、状态码、版本与脱敏地址标签。')],[sx('Excluded','排除'),sx('Tokens, cookies, credentials, personal file content and full company addresses.','令牌、Cookie、凭据、个人文件内容及完整公司地址。')],[sx('Destination','目标'),sx('Preview only. Nothing is uploaded or exported automatically.','仅预览，不自动上传或导出。')]])}`;actions=`<button class="btn primary" data-action="modalClose">${t('done')}</button>`}

function handleSettingsAction(a){if(!a.startsWith('settings:'))return false;const q=S.settings;if(a.startsWith('settings:group:')){openSettingsGroup(a.slice(15));return true}switch(a){case'settings:editBackup':S.details['settings-backup-edit']=true;render();break;case'settings:pending':if(q.control){S.modal='settingsTrusted';render({focusModal:true})}break;case'settings:home':q.group=null;changeView('settings');break;case'settings:check':runSettingsChecks();break;case'settings:cancel':clearTimeout(settingsTimer);q.checks.run++;q.checks.phase='notChecked';q.notice='cancelled';render();break;case'settings:validate':validateSettings();break;case'settings:reset':for(const f of settingFields(q.group))q.draft[f.key]=q.effective[f.key];q.languageDraftExplicit=false;invalidateSettings();q.notice='reset';render();break;case'settings:save':if(q.group!=='preferences'||q.validatedGroup!=='preferences'||q.validated!==settingsBinding())break;for(const f of settingFields('preferences')){if(q.effective[f.key]!==q.draft[f.key])q.origins[f.key]='set';q.effective[f.key]=q.draft[f.key]}q.languageDraftExplicit=false;q.version++;q.phase='effective';q.receipt={id:'LOCAL-PREF-'+q.version,host:q.effective.host,version:q.version,group:'preferences',kind:'local'};q.validated=null;q.notice='saved';try{localStorage.setItem('patrick-local-preferences-v23',JSON.stringify(Object.fromEntries(settingFields('preferences').map(f=>[f.key,q.effective[f.key]]))))}catch{}setLanguage(q.effective.interfaceLanguage,{render:false});document.documentElement.classList.toggle('local-reduced-motion',q.effective.motion==='reduce');render();break;case'settings:review':if(q.validated===settingsBinding())startSettingsControl('configuration');break;case'settings:fix':q.returnGroup=q.group||'execution';startSettingsControl('signin');break;case'settings:restore':startSettingsControl('restore');break;case'settings:handoff':if(!q.control||q.control.binding!==settingsBinding()){q.notice='stale';closeModal();break}q.phase='
