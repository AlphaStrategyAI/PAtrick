# Operator-reviewed starting point. Generation does not create or start this VM.
# Requires Lima 2.3+ for networkOpts.hostLoopback; validate with the installed version.
minimumLimaVersion: 2.3.0
base: template:ubuntu-24.04
vmType: vz
cpus: 2
memory: 4GiB
disk: 30GiB

# Plain mode disables mounts, SSH-agent forwarding, dynamic forwarding,
# the guest agent and bundled containerd even when a base template supplies them.
plain: true
mounts: []
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
containerd:
  system: false
  user: false
portForwards:
  - guestIP: 0.0.0.0
    proto: any
    guestPortRange: [1, 65535]
    ignore: true
copyToHost: []
propagateProxyEnv: false
networkOpts:
  hostLoopback: false

# No host repository, home, token, or environment file is mounted or copied.
# copyToHost is empty, so no session file is copied back to the host.
# The boot script rejects new output to private, link-local, and Lima gateway
# addresses except the slirp DNS resolvers. Reject stops the packet. Accept
# continues into later chains, so the guest worker firewall can still reject
# a worker's other output. This is not a public provider allowlist; that
# allowlist and the session byte cap are the guest proxy. See deployment.md.
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      dest=${1:-/etc/patrick-worker}
      if command -v nft >/dev/null 2>&1; then
        nft delete table inet patrick_boot >/dev/null 2>&1 || true
        nft -f - <<'EOF'
      table inet patrick_boot {
        chain output {
          type filter hook output priority -150; policy accept;
          meta l4proto udp ip daddr 192.168.5.2 udp dport 53 accept
          meta l4proto udp ip daddr 192.168.5.3 udp dport 53 accept
          ip daddr 10.0.0.0/8 reject
          ip daddr 172.16.0.0/12 reject
          ip daddr 192.168.0.0/16 reject
          ip daddr 169.254.0.0/16 reject
          ip6 daddr fc00::/7 reject
          ip6 daddr fe80::/10 reject
        }
      }
      EOF
      elif command -v iptables >/dev/null 2>&1 && command -v ip6tables >/dev/null 2>&1; then
        iptables -N PATRICK_BOOT
        iptables -A PATRICK_BOOT -p udp -d 192.168.5.2 --dport 53 -j ACCEPT
        iptables -A PATRICK_BOOT -p udp -d 192.168.5.3 --dport 53 -j ACCEPT
        iptables -A PATRICK_BOOT -d 10.0.0.0/8 -j REJECT
        iptables -A PATRICK_BOOT -d 172.16.0.0/12 -j REJECT
        iptables -A PATRICK_BOOT -d 192.168.0.0/16 -j REJECT
        iptables -A PATRICK_BOOT -d 169.254.0.0/16 -j REJECT
        iptables -I OUTPUT 1 -j PATRICK_BOOT
        ip6tables -N PATRICK_BOOT
        ip6tables -A PATRICK_BOOT -d fc00::/7 -j REJECT
        ip6tables -A PATRICK_BOOT -d fe80::/10 -j REJECT
        ip6tables -I OUTPUT 1 -j PATRICK_BOOT
      else
        echo patrick-boot-firewall-missing >&2
        exit 1
      fi
      mkdir -p "$dest"
      printf '%s\n' '33554432' > "$dest/session-upload-bytes"
      chmod 644 "$dest/session-upload-bytes"
