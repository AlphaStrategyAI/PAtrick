name: darwin release candidates

on:
  workflow_dispatch:
    inputs:
      promotion_run_id:
        description: 'Run with reviewed promotion artifact. Leave blank to build candidates.'
        type: string
        required: false
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/**'
      - 'docs/designs/设计资产/v2/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/observe-darwin-toolchain.mjs'
      - 'scripts/pack-release.mjs'
      - 'tests/admission/T23-controlled-role-launch.test.ts'
      - 'tests/admission/T23-emitted-candidate.test.ts'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/release-darwin.yml'
  push:
    branches: ['impl/patrick-plan']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/**'
      - 'docs/designs/设计资产/v2/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/observe-darwin-toolchain.mjs'
      - 'scripts/pack-release.mjs'
      - 'tests/admission/T23-controlled-role-launch.test.ts'
      - 'tests/admission/T23-emitted-candidate.test.ts'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/release-darwin.yml'

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name != 'workflow_dispatch' || inputs.promotion_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      NODE_VERSION: '26.13.0'
      NODE_HEADERS_SHA256: '519e269c3e78bf513fdf53d2ab114b763173a7c9424bd477d4e182d782ea366f'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.arch }}
      - name: Verify native Darwin host and toolchain
        run: |
          case "$TARGET_ARCH" in
            arm64) machine=arm64 ;;
            x64) machine=x86_64 ;;
            *) exit 1 ;;
          esac
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "$machine"
          translated=$(/usr/sbin/sysctl -in sysctl.proc_translated)
          test "${translated:-0}" = 0
          node --input-type=module -e '
            if (process.platform !== "darwin" || process.arch !== process.env.TARGET_ARCH ||
                process.version !== "v" + process.env.NODE_VERSION) {
              throw new Error("native Darwin Node version or architecture mismatch");
            }
            console.log(JSON.stringify({
              platform: process.platform, arch: process.arch, node: process.version, modules: process.versions.modules,
            }));
          '
      - name: Pack exact locked source candidate
        run: |
          version=$(node -p 'require("./package.json").version')
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          source_root=$(pwd -P)
          cd "$RUNNER_TEMP"
          mkdir candidate
          node "$source_root/scripts/pack-release.mjs" "$source_root" "$commit" "$version" "$TARGET_ARCH" 1 1 "candidate/patrick-darwin-$TARGET_ARCH.candidate.json" > candidate/receipt.json
          shasum -a 256 candidate/*.candidate.json > candidate/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: patrick-darwin-${{ matrix.arch }}-unsigned-source-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Download official Node headers
        run: |
          archive="node-v$NODE_VERSION-headers.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            "https://nodejs.org/dist/v$NODE_VERSION/$archive" --output "$RUNNER_TEMP/$archive"
      - name: Observe unsigned Darwin toolchain
        id: observe
        continue-on-error: true
        run: |
          evidence="$RUNNER_TEMP/patrick-toolchain-observation"
          mkdir "$evidence"
          node scripts/observe-darwin-toolchain.mjs "$TARGET_ARCH" "$GITHUB_SHA" > "$evidence/toolchain.json"
          (
            cd "$evidence"
            shasum -a 256 toolchain.json > SHA256SUMS
            cat SHA256SUMS
            node -e 'const r = require("./toolchain.json"); console.log(JSON.stringify({
              commit: r.commit, target: r.target, host: r.host, hostConsistency: r.hostConsistency,
              headers: r.headers, sources: r.sources, developer: r.developer, sdk: r.sdk, tools: r.tools,
              fixedInputs: r.fixedInputs, dependencyScan: r.dependencyScan
            }));'
          )
      - name: Upload unsigned toolchain observation
        if: steps.observe.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: patrick-darwin-${{ matrix.arch }}-${{ github.sha }}-unsigned-toolchain-observation
          path: |
            ${{ runner.temp }}/patrick-toolchain-observation/toolchain.json
            ${{ runner.temp }}/patrick-toolchain-observation/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Install locked dependencies and compile better-sqlite3
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          checkout_status=$(git status --porcelain=v1 --untracked-files=all)
          test -z "$checkout_status"
          node_root=$(node -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')
          npm_root="$node_root/lib/node_modules/npm"
          node "$npm_root/bin/npm-cli.js" ci --ignore-scripts --no-audit --no-fund
          node --input-type=commonjs -e '
            const locked = require("./package-lock.json").packages["node_modules/better-sqlite3"];
            const installed = require("./node_modules/better-sqlite3/package.json");
            if (!locked?.integrity || installed.name !== "better-sqlite3" || installed.version !== locked.version) {
              throw new Error("installed better-sqlite3 does not match the dependency lock");
            }
          '
          archive="$RUNNER_TEMP/node-v$NODE_VERSION-headers.tar.xz"
          printf '%s  %s\n' "$NODE_HEADERS_SHA256" "$archive" | shasum -a 256 -c -
          headers=$(mktemp -d "$RUNNER_TEMP/patrick-node-headers.XXXXXXXX")
          /usr/bin/tar -xf "$archive" -C "$headers"
          xcrun --find clang
          xcrun --find make
          python3 --version
          (
            cd node_modules/better-sqlite3
            node "$npm_root/node_modules/node-gyp/bin/node-gyp.js" rebuild \
              --arch="$TARGET_ARCH" --nodedir="$headers/node-v$NODE_VERSION" --devdir="$headers/gyp-cache"
          )
      - name: Build and verify archived deployment-complete material
        run: |
          source_root=$(pwd -P)
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          checkout_status=$(git status --porcelain=v1 --untracked-files=all)
          test -z "$checkout_status"
          work=$(mktemp -d "$RUNNER_TEMP/patrick-materials.XXXXXXXX")
          work=$(cd "$work" && pwd -P)
          upload="$RUNNER_TEMP/patrick-native-material-upload"
          mkdir "$upload" "$work/readback"

          hub_commit=$(node --input-type=module -e 'import { autoloopHub } from "./deploy/lib/deployment-templates.mjs"; console.log(autoloopHub.commit)')
          git init --quiet "$work/autoloop"
          git -C "$work/autoloop" fetch --quiet --depth=1 https://github.com/KKKKhazix/agent-autoloop.git "$hub_commit"
          git -C "$work/autoloop" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$work/autoloop" rev-parse HEAD)" = "$hub_commit"

          node scripts/build-runtime.mjs build --profile deployment-complete \
            --source-root "$source_root" --source-commit "$commit" --output-root "$work/materials" \
            --autoloop-root "$work/autoloop" > "$work/build.json"
          /usr/bin/tar --format=ustar --no-mac-metadata -cf "$upload/runtime-materials.tar" -C "$work/materials" .
          (
            cd "$upload"
            shasum -a 256 runtime-materials.tar > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )
          /usr/bin/tar -xpf "$upload/runtime-materials.tar" -C "$work/readback"
          node scripts/build-runtime.mjs verify --profile deployment-complete \
            --artifact-root "$work/readback" > "$work/readback.json"
          PATRICK_T23_CONTROLLED_LAUNCH=1 PATRICK_T23_CONTROLLED_MATERIALS="$work/readback" \
            node node_modules/vitest/vitest.mjs run tests/admission/T23-controlled-role-launch.test.ts
          admission_tmp=$(mktemp -d "$work/admission.XXXXXXXX")
          TMPDIR="$admission_tmp" PATRICK_T23_AUTOLOOP_SOURCE="$work/autoloop" PATRICK_T23_AUTOLOOP_MATERIALS="$work/readback" \
            node node_modules/vitest/vitest.mjs run tests/admission/T23-emitted-candidate.test.ts --maxWorkers 1 \
              --testNamePattern 'signed deployment includes|first install initializes Hub|starts the packaged Hub|starts installed roles from the confirmed generation'

          node --input-type=module - "$work" "$upload" > "$upload/readback-receipt.json" <<'JS'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";

          const [work, upload] = process.argv.slice(2);
          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          const built = readJson(join(work, "build.json"));
          const readback = readJson(join(work, "readback.json"));
          const { source, observed, native } = readJson(join(work, "readback/metadata/runtime-materials.json"));
          if (built.status !== "built" || readback.status !== "verified" ||
              built.profile !== readback.profile || built.inventorySha256 !== readback.inventorySha256 ||
              built.inventoryBytes !== readback.inventoryBytes || built.files !== readback.files ||
              source.kind !== "commit" || source.commit !== process.env.GITHUB_SHA ||
              source.snapshotSha256 !== built.sourceSnapshotSha256 ||
              observed.platform !== process.platform || observed.arch !== process.arch ||
              observed.node !== process.version || observed.modules !== process.versions.modules) {
            throw new Error("archived runtime inventory differs from the build");
          }
          const sha256 = readFileSync(join(upload, "SHA256SUMS"), "utf8").split(" ")[0];
          console.log(JSON.stringify({
            kind: "unsigned-deployment-complete-materials",
            source, observed, native,
            archive: { name: "runtime-materials.tar", sha256 },
            readback,
          }, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: patrick-darwin-${{ matrix.arch }}-unsigned-deployment-complete-materials
          path: |
            ${{ runner.temp }}/patrick-native-material-upload/runtime-materials.tar
            ${{ runner.temp }}/patrick-native-material-upload/SHA256SUMS
            ${{ runner.temp }}/patrick-native-material-upload/readback-receipt.json
          if-no-files-found: error
          retention-days: 90

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promotion_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: darwin-release
    concurrency:
      group: darwin-release-promotion
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Require reviewed promotion inputs
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          ACCEPTED_ARTIFACT_ID: ${{ secrets.PATRICK_DARWIN_PROMOTION_ARTIFACT_ID }}
          ACCEPTANCE_PINS: ${{ secrets.PATRICK_DARWIN_ACCEPTANCE_PINS }}
        run: |
          [[ "$PROMOTION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ACCEPTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$ACCEPTANCE_PINS"
          umask 077
          printf '%s' "$ACCEPTANCE_PINS" > "$RUNNER_TEMP/darwin-release-pins.json"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ secrets.PATRICK_DARWIN_PROMOTION_ARTIFACT_ID }}
          merge-multiple: true
          run-id: ${{ inputs.promotion_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/darwin-promotion
      - name: Promote exact accepted assets and verify published bytes
        env:
          GH_TOKEN: ${{ secrets.PATRICK_DARWIN_RELEASE_TOKEN || github.token }}
        run: |
          node scripts/publish-signed-darwin-assets.mjs "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/darwin-release-pins.json" "$RUNNER_TEMP/darwin-promotion"
