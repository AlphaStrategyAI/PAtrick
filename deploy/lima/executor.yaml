minimumLimaVersion: 2.0.0
vmType: vz
arch: null
cpus: 2
memory: 4GiB
disk: 20GiB
mounts: []
mountType: virtiofs

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false

containerd:
  system: false
  user: false

images:
- location: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
  digest: sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55
  variant: server
- location: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img
  arch: x86_64
  digest: sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
  variant: server

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eu
    if ! id executor >/dev/null 2>&1; then
      useradd --create-home --shell /bin/bash executor
    fi
    install -d -o executor -g executor \
      /var/lib/patrick-executor/home \
      /var/lib/patrick-executor/output \
      /var/lib/patrick-executor/snapshot
    printf '%s\n' patrick-executor > /etc/patrick-executor-vm
    chmod 644 /etc/patrick-executor-vm
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends ca-certificates curl xz-utils python3 make g++
    node_version=26.13.0
    machine="$(uname -m)"
    if [ "$machine" = "aarch64" ]; then
      node_arch=arm64
      node_sha=406fe3fbde1c054adff8b297c16fdb5af6659db327c1ac8acd46b56ef1af9a92
    elif [ "$machine" = "x86_64" ]; then
      node_arch=x64
      node_sha=d28a96af6c38596f6d9d97c0ee531c13d238d757742387d1928de822d959e997
    else
      echo "unsupported architecture ${machine}" >&2
      exit 1
    fi
    node_dist="node-v${node_version}-linux-${node_arch}"
    tmp="$(mktemp)"
    curl -fsSL "https://nodejs.org/dist/v${node_version}/${node_dist}.tar.xz" -o "$tmp"
    printf '%s  %s\n' "$node_sha" "$tmp" | sha256sum -c -
    tar -xJf "$tmp" -C /usr/local --strip-components=1
    rm -f "$tmp"
    ln -sfn /usr/local/bin/node /usr/bin/node
    ln -sfn /usr/local/bin/npm /usr/bin/npm
    ln -sfn /usr/local/bin/npx /usr/bin/npx
    install -d /etc/profile.d
    printf '%s\n' 'export PATH="/usr/local/bin:${PATH}"' > /etc/profile.d/patrick-node.sh
    chmod 644 /etc/profile.d/patrick-node.sh
    hash -r
    /usr/local/bin/node --version
    /usr/local/bin/npm --version
